name: Nightly

# Builds all three platforms every night and publishes them to a single rolling
# "nightly" release, marked Latest. The tag is re-pointed each run, so a
# downloader always finds one "latest nightly". Nightly is the only channel this
# repository ships, which is why --latest below is unconditional.
#
# **Everything is in the download.** libav* is linked into these binaries rather
# than called as a subprocess, so there is no ffmpeg to install, nothing on a
# PATH to conflict with, and no version of it to be wrong. That is the same fact
# that makes this binary GPL-3.0-or-later while bro stays MIT.
#
# **Both applications ship, from one build.** `ffmpeg-bro` is the workbench over
# ffmpeg's model and `supercut` is the second application over the same core and
# the same document format, so a .fbro written in one opens in the other. They
# are two executables and not two downloads for exactly that reason.
#
# **And one download per platform, with the GPU backend in it.** CUDA on Windows
# and Linux, Metal on macOS, because supercut's transcription is days per
# recording without one. brotensor falls back when there is no device, so the
# same zip serves a machine with a card and a machine without; the smoke test
# below runs it on a runner that has none. See the CUDA toolkit step.
#
# **A macOS failure holds the release.** `publish` needs the whole matrix, so a
# platform that stops compiling stops the night's release rather than quietly
# shipping two thirds of one. Nightly is a signal as much as it is a channel; if
# that trade stops being worth it, the change is a per-platform publish here.

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily, an hour after bro's
  workflow_dispatch:

# One nightly at a time; a newer trigger cancels an in-flight run.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must match vcpkg.json's builtin-baseline; see the same pin in ci.yml.
  VCPKG_COMMIT: 0b88aacde46a853151730fbe7d0b7ee45f4b6864
  SCCACHE_GHA_ENABLED: "true"
  # Which bro a nightly is built against; see ci.yml's header for why this is a
  # branch and not a pin. A release built from a moving engine is a real thing
  # to know about this channel: the smoke test on the packaged tree is what
  # stands in for the pointer nobody records.
  BRO_REF: main

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    # id-token lets the Windows job mint a GitHub OIDC token and exchange it for
    # an Azure one (see the signing steps). Declared per-job rather than at the
    # top level so only this job can request it.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `gpu` is which brotensor backend this platform's nightly compiles
          # in; see the CUDA toolkit step for why there is one download per
          # platform rather than a CPU one and a GPU one.
          - { name: linux,   os: ubuntu-24.04, triplet: x64-linux,   jobs: 4, gpu: cuda  }
          - { name: windows, os: windows-2022, triplet: x64-windows, jobs: 4, gpu: cuda  }
          # **macos-15 and not macos-14, and that is brotensor's requirement
          # rather than a preference.** Its Metal offset path calls MPSNDArray
          # `-initWithBuffer:offset:descriptor:`, a selector the macOS 14 SDK
          # does not declare, so the runner one version back does not fail to
          # link or fail at runtime, it fails to compile. ci.yml stays on
          # macos-14 because it builds no Metal backend at all.
          - { name: macos,   os: macos-15,     triplet: arm64-osx,   jobs: 3, gpu: metal }
    steps:
      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - uses: actions/checkout@v7
        with:
          path: ffmpeg-bro
          fetch-depth: 0        # tags, for package-release.sh's version fallback

      # bro is a sibling checkout rather than a submodule, so there is no pointer
      # pinning it. See ci.yml's header for why that trade is deliberate, and
      # BRO_REF above for how to hold it still.
      - name: Check out bro beside it
        uses: actions/checkout@v7
        with:
          repository: wlejon/bro
          ref: ${{ env.BRO_REF }}
          path: bro
          submodules: recursive

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm yasm autoconf autoconf-archive automake libtool pkg-config bison flex \
            xvfb libgl1-mesa-dri \
            libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev \
            libfreetype-dev libfontconfig1-dev libpng-dev libjpeg-dev libwebp-dev

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja nasm automake autoconf autoconf-archive libtool pkg-config

      # ── the GPU backend, which is what makes transcription usable ──────────
      #
      # `supercut` offers to transcribe a recording (`supercut/acquire.js`), and
      # that is Parakeet through brosoundml on brotensor. Measured on an RTX
      # 4090 it runs at 81x realtime, so a six-hour VOD is about five minutes;
      # the same model on the CPU is a different kind of afternoon. A nightly
      # built without a backend therefore ships a button nobody can usefully
      # press, which is what every nightly before this one did.
      #
      # **One download per platform, not a CPU one and a GPU one.** brotensor
      # falls back when there is no device, and the runner proves it: there is
      # no NVIDIA card on any GitHub-hosted machine, so the smoke test below
      # runs this exact binary with no driver present. A second artifact would
      # be two things to explain and two things to pick wrongly.
      #
      # **The architectures have to be named, and the list is not a preference.**
      # brotensor defaults `CMAKE_CUDA_ARCHITECTURES` to `native`, which asks the
      # local card what it is and there is not one here. What replaces it is
      # Ampere and later, because brotensor's WMMA kernels instantiate a
      # `__nv_bfloat16 wmma::fragment` with no `__CUDA_ARCH__` guard and that
      # fragment type only exists on sm_80+. Anything earlier does not run
      # slowly, it fails to compile: this nightly's first run named `75-real`
      # and got `incomplete type ... __nv_bfloat16` out of `fp16_matmul.cu`.
      #
      # **These two facts are bro's and are copied here**, from
      # `bro/.github/workflows/nightly.yml`, which learned both the same way.
      # That is a second home for something neither repository owns: the
      # architectures a brotensor build can target, and the SDK its Metal path
      # needs, are properties of brotensor, and every embedder that ships a
      # binary has to rediscover them. Worth moving down rather than copying a
      # third time.
      #
      # The weights are still not shipped and cannot be: with no checkpoint in
      # any of the places `corpus/words.js` searches, supercut offers no
      # `Transcribe` and says so, and `brosoundml/scripts/download-parakeet.sh`
      # is what puts one on disk. This makes the GPU path exist, not the
      # download bigger by several gigabytes.
      - name: CUDA toolkit
        if: matrix.gpu == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.2"
          method: network
          use-github-cache: true
          # Linux only: the full `cuda` meta-package pulls in nvidia-driver-*-open,
          # whose DKMS post-install fails on a driverless runner and reds the job.
          # brotensor links CUDA::cudart_static and compiles its own kernels, with
          # no cuBLAS or cuFFT, so nvcc plus the cudart dev package is the whole
          # requirement and naming them excludes the driver. Windows has no DKMS
          # step and its full install works, so it stays on the default.
          sub-packages: ${{ runner.os == 'Linux' && '["nvcc", "cudart-dev"]' || '[]' }}

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Shared with ci.yml: the key is content-addressed per package, not per
      # workflow, so a warm CI run warms the nightly and the reverse. Restore
      # and save are separate for the reason ci.yml's comment gives: the
      # combined action saves only on success, and a nightly that fails at the
      # signing step would otherwise rebuild ffmpeg from source tomorrow.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('ffmpeg-bro/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-bin-${{ matrix.triplet }}-${{ hashFiles('ffmpeg-bro/vcpkg.json') }}-
            vcpkg-bin-${{ matrix.triplet }}-

      # **Before the vcpkg step, and that ordering is load-bearing.** This action
      # exports the Visual Studio developer environment, and that includes a
      # `VCPKG_ROOT` pointing at the vcpkg bundled with VS. Run after the step
      # below it silently overwrites the pin, and the build still succeeds
      # because vcpkg.json's builtin-baseline still pins the ports; what is lost
      # is the tool and the scripts. See ci.yml, which has the same ordering for
      # the same reason.
      - name: MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: vcpkg (pinned)
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          mkdir -p "$RUNNER_TEMP/vcpkg-bincache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-bincache" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        working-directory: ffmpeg-bro
        run: |
          GEN_ARGS=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            GEN_ARGS="-G Ninja -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded"
          fi
          # See the CUDA toolkit step above for both of these.
          GPU_ARGS=""
          if [ "${{ matrix.gpu }}" = "cuda" ]; then
            # Ampere and later, with a PTX tail for anything newer to JIT from.
            # sccache caches nvcc too, and routing the CUDA compiler through it
            # is what stops the heaviest translation units in the tree from
            # recompiling every night while every C++ object hits the cache.
            CUDA_ARCHS="80-real;86-real;89-real;90-real;90-virtual"
            GPU_ARGS="-DBRO_WITH_TENSOR_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=$CUDA_ARCHS -DCMAKE_CUDA_COMPILER_LAUNCHER=sccache"
          elif [ "${{ matrix.gpu }}" = "metal" ]; then
            GPU_ARGS="-DBRO_WITH_TENSOR_METAL=ON"
          fi
          cmake -B build \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            $GEN_ARGS $GPU_ARGS

      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        working-directory: ffmpeg-bro
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}

      - name: Package
        shell: bash
        working-directory: ffmpeg-bro
        run: |
          VERSION="nightly-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          scripts/package-release.sh --version "$VERSION" --build-dir build --config Release

      # Prove the packaged tree runs, from the packaged tree and nowhere else.
      # Three things are asserted, and each of them has silently not been true
      # of a build before:
      #
      #   * libav is linked in. A binary that loads and reports `linked: false`
      #     is a GUI over nothing.
      #   * `bro.sense` is the real binding and not the stub. CLAUDE.md's rule:
      #     the real one does NOT set `available`, only the stub does, so `=== false`
      #     is the test and `typeof analyze` is not (the stub has that too).
      #     This is what catches a build that lost BRO_WITH_SOUNDML.
      #   * libx264 and libx265 are present. They are what `gpl` and `version3`
      #     in vcpkg.json buy, and a manifest that resolved without them
      #     produces an application that opens files and cannot export.
      #   * `bro.tensor` is the real binding and not the stub, which is the one
      #     readable-at-runtime proof that the GPU backend actually compiled in.
      #     The failure it catches is silent by construction: a CUDA toolkit the
      #     action did not install leaves brotensor building CPU-only, and the
      #     result is a nightly that looks identical and transcribes at days per
      #     recording. `=== false` is again the test rather than `typeof`, for
      #     the reason bro.sense's line above gives.
      #
      # **This step is also the fallback test.** No GitHub-hosted runner has an
      # NVIDIA card, so a probe that runs to completion here is this exact
      # binary starting with the backend compiled in and no driver to talk to.
      # That is the property the single-download decision rests on, and it is
      # checked every night rather than assumed.
      #
      # It runs before signing, so a package that fails this is never signed.
      - name: Smoke test (the packaged application)
        shell: bash
        working-directory: ffmpeg-bro
        run: |
          d=$(ls -d dist/ffmpeg-bro-${VERSION}-* | head -1)
          cd "$d"
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; else EXE=""; fi
          # Say what is here before trying to run it. A binary that cannot be
          # exec'd reports 127 and nothing else, and on Windows that is what a
          # *missing DLL beside it* looks like too, so the bare exit code cannot
          # tell an absent file from an unresolved import. This run's log is
          # cheaper than the next run.
          echo "package: $(pwd)"
          ls -la | head -30
          echo "binaries: $(ls -1 *"$EXE" 2>/dev/null | tr '\n' ' ')"
          echo "libraries: $(ls -1 *.dll 2>/dev/null | wc -l)"
          if [ ! -f "./ffmpeg-bro-headless$EXE" ]; then
              echo "the packaged tree has no ffmpeg-bro-headless$EXE in it" >&2
              exit 1
          fi
          # The file is there and Windows still refuses to start it, which looks
          # like an import that did not resolve, and the loader names none of
          # them. Ask the linker what each image needs and check the answers
          # against what is beside them and what is in System32. Walked over the
          # packaged libraries as well as the binary, because a direct import
          # that is present can still fail on a dependency of its own. dumpbin is
          # on PATH because the MSVC environment is set up for the build;
          # `-dependents` rather than `/dependents` so MSYS does not rewrite it
          # into a path.
          #
          # **`api-ms-win-*` is skipped, and that is not a shortcut.** Those are
          # API set contracts, resolved by the loader through the apiset schema
          # onto whichever DLL implements them, and they are not files anywhere.
          # Looking for them on disk reported fifteen missing imports on a binary
          # whose imports were all fine.
          #
          # This **reports and does not stop**: the question is what is wrong,
          # and exiting here means never seeing what the binary itself says.
          if [ "$RUNNER_OS" = "Windows" ]; then
              missing=""
              for img in "ffmpeg-bro-headless$EXE" *.dll; do
                  for dll in $(dumpbin -dependents "$img" 2>/dev/null | tr -d '\r' \
                               | sed -n 's/^ *\([A-Za-z0-9_.+-]*\.[Dd][Ll][Ll]\)$/\1/p'); do
                      case "$dll" in [aA][pP][iI]-ms-win-*|[aA][pP][iI]-MS-Win-*) continue ;; esac
                      [ -f "./$dll" ] && continue
                      [ -f "/c/Windows/System32/$dll" ] && continue
                      case " $missing " in *" $dll "*) continue ;; esac
                      missing="$missing $dll"
                  done
              done
              if [ -n "$missing" ]; then
                  echo "imports that resolve to nothing:$missing"
              else
                  echo "every import of the binary and of the libraries beside it resolves"
              fi
          fi
          PROBE='
            if (!bro.ffmpeg || bro.ffmpeg.linked !== true)
                throw new Error("libav is not linked into this build");
            if (!bro.sense || bro.sense.available === false)
                throw new Error("bro.sense is absent or is the stub: BRO_WITH_SOUNDML did not survive");
            if (!bro.tensor || bro.tensor.available === false)
                throw new Error("bro.tensor is the stub: no GPU backend compiled into this build, "
                                + "so transcription would run on the CPU at days per recording");
            const ids = bro.ffmpeg.encoders.map(function (e) { return e.id; });
            ["libx264", "libx265"].forEach(function (need) {
                if (ids.indexOf(need) < 0)
                    throw new Error("encoder missing from this build: " + need);
            });
            console.log("linked " + bro.ffmpeg.version
                        + " gpu-backend=yes (no device on this runner)"
                        + " encoders=" + ids.length
                        + " muxers=" + bro.ffmpeg.muxers.length
                        + " demuxers=" + bro.ffmpeg.demuxers.length
                        + " filters=" + bro.ffmpeg.filters.length);
          '
          # Run it with the shell's abort-on-error off and report the status by
          # hand. `-e` would end the step on a non-zero exit with nothing said,
          # and the whole difficulty here has been telling apart a shell that
          # could not start the binary from a probe that ran and refused.
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a "./ffmpeg-bro-headless$EXE" app/ui -e "$PROBE"
          else
            "./ffmpeg-bro-headless$EXE" app/ui -e "$PROBE"
          fi
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "the packaged headless binary exited $rc" >&2
            exit "$rc"
          fi

      # --- Windows code signing ---------------------------------------------
      # Signs the packaged tree before it is zipped, so what users download is
      # what was signed. Authenticode covers PE files only; the Linux and macOS
      # zips ship unsigned (macOS notarization needs an Apple Developer ID,
      # which is a separate thing entirely, and package-release.sh's README.txt
      # tells a macOS downloader what to do about Gatekeeper).
      #
      # No key or secret exists in this repo or on the runner. Auth is GitHub
      # OIDC federation against the same Entra app bro and bronze use, whose
      # federated credential for this repository only trusts subject
      # repo:wlejon/ffmpeg-bro:ref:refs/heads/main, and the signing key never
      # leaves Azure's HSM: the action uploads a digest and gets a signature
      # back. The three AZURE_* values are identifiers, not credentials, which
      # is why they are `vars` and not `secrets`.
      #
      # Timestamping is load-bearing, not optional: Artifact Signing issues
      # ~3-day certificates, so an untimestamped signature stops validating
      # almost immediately. The RFC3161 countersignature pins validity to
      # signing time and keeps old nightlies verifiable after rotation.
      - name: Resolve package directory (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ffmpeg-bro
        run: |
          d=$(ls -d dist/ffmpeg-bro-${VERSION}-* | head -1)
          # Absolute Windows path: the signing action is .NET and does not
          # understand MSYS-style /d/... paths.
          echo "PKG_DIR=$(cygpath -w "$(pwd)/$d")" >> "$GITHUB_ENV"

      - name: Azure login (OIDC, no stored secret)
        if: runner.os == 'Windows'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://cus.codesigning.azure.net/
          signing-account-name: brosigning
          certificate-profile-name: broPublicTrust
          files-folder: ${{ env.PKG_DIR }}
          # The three executables plus the vcpkg DLLs loaded into our process.
          # Every PE in this package is at its root (the interfaces under app/
          # are JavaScript and CSS), so there is nothing to recurse into.
          # Basic SKU allows 5,000 signatures/month; a nightly uses a few dozen.
          files-folder-filter: exe,dll
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Fail the job rather than publish silently-unsigned binaries if the step
      # above ever soft-fails. Get-AuthenticodeSignature rather than signtool
      # because it is built into PowerShell and needs no SDK path hunt. Both
      # applications are checked by name: an unsigned executable inside a signed
      # package is the one a machine blocks.
      - name: Verify signatures (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = @()
          foreach ($exe in @('ffmpeg-bro.exe','supercut.exe','ffmpeg-bro-headless.exe')) {
            $p = Join-Path $env:PKG_DIR $exe
            if (-not (Test-Path $p)) { Write-Host "MISSING $exe"; $bad += $exe; continue }
            $sig = Get-AuthenticodeSignature $p
            Write-Host "$exe -> $($sig.Status) | $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { $bad += $exe }
          }
          if ($bad.Count) { throw "unsigned or invalid: $($bad -join ', ')" }

      - name: Zip
        shell: bash
        working-directory: ffmpeg-bro
        run: |
          cd dist
          d=$(ls -d ffmpeg-bro-${VERSION}-* | head -1)
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "${d}.zip" "$d" >/dev/null
          else
            zip -qr "${d}.zip" "$d"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-bro-${{ matrix.name }}
          path: ffmpeg-bro/dist/ffmpeg-bro-nightly-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish rolling nightly
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7      # for the commit sha the release targets
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Re-point the single "nightly" tag and release at this run's commit and
      # replace its assets. Deleting first, with --cleanup-tag, is the reliable
      # way to move the tag.
      #
      # --latest is explicit and load-bearing: nightly is the only release this
      # repository publishes, so it must be what GitHub serves at
      # /releases/latest and shows at the top of the releases page. Without it,
      # GitHub falls back to "most recent non-prerelease" and picks whatever
      # else happens to exist.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          NOTES="Automated nightly build from \`${GITHUB_SHA::7}\` on $(date -u +%Y-%m-%d).

          Unzip and run. ffmpeg is linked into these binaries rather than called as a subprocess, so there is nothing else to install and nothing on your PATH is used: 350+ demuxers, 180+ muxers, 500+ filters, x264 and x265, all in the one download.

          Two applications, one build. \`ffmpeg-bro\` is the workbench over ffmpeg's whole model, from capture through the filter graph to the muxer. \`supercut\` is the second one: search hours of transcribed recordings for what somebody said, hear it, and cut it together. They share the render and the document format, so a \`.fbro\` written in either opens in the other. \`ffmpeg-bro-headless\` is the same engine driven by a script.

          Transcription runs on the GPU: CUDA on Windows and Linux, Metal on macOS. There is one download per platform and it runs with or without a card, falling back on its own. On an RTX 4090 a six-hour recording is about five minutes, and on a CPU it is far slower, so a card is what makes that feature worth using. The Parakeet weights are not in the zip and are fetched separately: with none on this machine supercut offers no Transcribe, and its \`Model…\` button points at a checkpoint wherever you put one. A \`models/parakeet\` folder beside the binaries is where it looks first.

          The Windows binaries are code-signed. The Linux and macOS ones are not, so macOS will quarantine them until you run \`xattr -dr com.apple.quarantine\` on the folder; the README.txt in each zip says so too.

          Pre-alpha. \`docs/manual/not-yet.md\` in the zip is the honest list of what does not work yet."
          gh release create nightly \
            --target "$GITHUB_SHA" \
            --title "Nightly ($(date -u +%Y-%m-%d))" \
            --notes "$NOTES" \
            --latest \
            artifacts/*.zip
