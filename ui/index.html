<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ffmpeg-bro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="topbar">
        <span id="appname">ffmpeg&#8203;-bro</span>
        <span id="filename" class="dim">no media</span>
        <span id="chips"></span>
        <span class="spacer"></span>
        <span id="libav" class="dim mono"></span>
    </header>

    <div id="main">
        <section id="viewer">
            <!-- The output canvas. Clips are placed inside it, each in its own
                 crop window; the stage itself is what "resize the canvas"
                 resizes. -->
            <div id="stage">
                <div id="cropbox" class="hidden">
                    <div class="ch mid" data-h="move"></div>
                    <div class="ch" data-h="nw"></div>
                    <div class="ch" data-h="n"></div>
                    <div class="ch" data-h="ne"></div>
                    <div class="ch" data-h="w"></div>
                    <div class="ch" data-h="e"></div>
                    <div class="ch" data-h="sw"></div>
                    <div class="ch" data-h="s"></div>
                    <div class="ch" data-h="se"></div>
                </div>
            </div>
            <div id="dropzone">
                <div class="dz-icon">&#9654;</div>
                <p class="big">Drop a media file here</p>
                <p class="dim">anything ffmpeg can read &mdash; mp4, mkv, mov, webm, avi, ts&hellip;</p>
                <p class="dim">drop more to add them to the timeline</p>
            </div>
            <div id="osd" class="hidden"></div>
        </section>

        <!-- Transform above Media: the transform is what you reach for, and a
             file with seven streams would otherwise push it off the bottom. -->
        <aside id="inspector">
            <div id="transform"></div>
            <div class="panel-title">Media</div>
            <div id="mediainfo" class="dim pad">Nothing loaded.</div>
        </aside>
    </div>

    <footer id="controls">
        <div id="scrubrow">
            <span id="tc-current" class="mono tc">00:00:00:00</span>
            <div id="scrub">
                <div id="scrub-track">
                    <div id="scrub-played"></div>
                    <div id="scrub-head"></div>
                </div>
            </div>
            <span id="tc-duration" class="mono tc dim">00:00:00:00</span>
        </div>

        <!-- Three zones. The side zones share the leftover width equally, which
             is what keeps the transport dead-centre under the picture however
             wide the readouts on either side happen to grow. -->
        <div id="buttonrow">
            <div class="zone start">
                <button id="btn-loop" class="icon" data-icon="loop" title="Loop (L)"></button>
                <div class="field">
                    <label for="rate">Speed</label>
                    <select id="rate">
                        <option value="0.25">0.25&times;</option>
                        <option value="0.5">0.5&times;</option>
                        <option value="1" selected>1&times;</option>
                        <option value="1.5">1.5&times;</option>
                        <option value="2">2&times;</option>
                        <option value="4">4&times;</option>
                    </select>
                </div>
            </div>

            <div class="zone center">
                <button id="btn-start" class="icon" data-icon="start" title="Go to start (Home)"></button>
                <button id="btn-prev" class="icon" data-icon="prev" title="Previous frame (Left)"></button>
                <button id="btn-play" class="icon primary" data-icon="play" title="Play / Pause (Space)"></button>
                <button id="btn-next" class="icon" data-icon="next" title="Next frame (Right)"></button>
                <button id="btn-end" class="icon" data-icon="end" title="Go to end (End)"></button>
            </div>

            <div class="zone end">
                <span id="stats" class="mono dim"></span>
                <button id="btn-mute" class="icon" data-icon="volume" title="Mute (M)"></button>
                <div id="volume">
                    <div id="vol-track">
                        <div id="vol-fill"></div>
                        <div id="vol-head"></div>
                    </div>
                </div>
                <button id="btn-full" class="icon" data-icon="full" title="Fullscreen (F)"></button>
            </div>
        </div>

        <div id="timeline">
            <div id="tl-bar">
                <!-- Same gutter the ruler and the lanes use, so the zoom
                     controls start on the timeline's left edge rather than
                     hanging off it. -->
                <div class="track-head"></div>
                <div class="group">
                    <button id="btn-zoom-out" class="icon" data-icon="zoomOut" title="Zoom out (-)"></button>
                    <button id="btn-zoom-in" class="icon" data-icon="zoomIn" title="Zoom in (+)"></button>
                    <button id="btn-zoom-fit" class="text" title="Fit the whole timeline (0)">Fit</button>
                </div>
                <span id="tl-zoom" class="mono dim"></span>
                <div class="group">
                    <button id="btn-split" class="text" title="Split at the playhead (S)">Split</button>
                    <button id="btn-grid" class="text" title="Lay every clip out as a grid (G)">Grid</button>
                </div>
                <span class="spacer"></span>
                <span class="dim tl-hint">wheel zooms &middot; shift+wheel pans &middot;
                    drag a clip to move it, its ends to trim, another lane to restack</span>
            </div>
            <div id="ruler-row">
                <div class="track-head"></div>
                <div id="ruler"></div>
            </div>
            <!-- The video lanes are built from the model: how many there are
                 is a property of the edit, not of the markup. -->
            <div id="tracks">
                <div id="playhead"></div>
            </div>
            <div id="audio-row" class="track-row">
                <div class="track-head"><span class="track-name">A1</span></div>
                <div class="track-lane" id="lane-audio"><canvas id="wave"></canvas></div>
            </div>
            <div id="tl-scroll-row">
                <div class="track-head"></div>
                <div id="tl-scroll"><div id="tl-thumb"></div></div>
            </div>
        </div>
    </footer>

    <script type="module" src="app.js"></script>
</body>
</html>
