<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>supercut</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Three regions and no navigation, which is the whole difference between this
     and ffmpeg-bro: find on the left, watch on the right, cut along the bottom.
     Everything is on the screen at once because the job is a loop between those
     three and a stage you have to walk to is a loop you stop running. -->

<header id="top">
    <span id="brand">supercut</span>
    <span id="chan-wrap"></span>
    <span id="about" class="dim"></span>
    <span class="spacer"></span>
    <span id="doc" class="dim"></span>
    <!-- What is running, anywhere: a download, a transcription, a cut, a proxy,
         the render. Absent while nothing is — see `inflight.js`. -->
    <button id="btn-flight" class="text" hidden></button>
    <button id="btn-open" class="text" title="Open (Ctrl+O)">Open</button>
    <button id="btn-save" class="text" title="Save (Ctrl+S)">Save</button>
    <button id="btn-render" class="go" title="Render (Ctrl+R)">Render</button>
</header>

<!-- The list behind that button. Over the window rather than in the layout: it
     is the answer to a question asked for a moment, and a region that pushed the
     finder down every time a proxy started would be four kinds of work
     rearranging the window they are running behind. -->
<div id="flight" hidden></div>

<div id="body">

    <!-- The finder. Not a panel over something else and not a stage you walk
         to: in this application it is half the work, so it is half the window. -->
    <section id="finder">
        <div id="f-tabs" class="tabs">
            <button data-tab="recordings" class="on">Recordings</button>
            <button data-tab="words">Words</button>
            <button data-tab="talking">Talking</button>
            <!-- The fourth question, and the one that is a sentence rather
                 than a search: you know what it should say, and the corpus is
                 what it is built out of. -->
            <button data-tab="line">Line</button>
        </div>
        <div id="f-controls"></div>
        <div id="f-note" class="note dim"></div>
        <!-- On while a search is walking the corpus and off the moment it is
             not. Fifty hours is long enough that a list still filling in and a
             list that found nothing are the same picture without it. -->
        <div id="f-progress" hidden><i></i></div>
        <div id="f-list"></div>
    </section>

    <section id="right">
        <!-- The picture. One element is on it at a time and `screen.js` decides
             which: a recording being auditioned, the clip under the playhead, or
             the render of the whole mix while it plays. -->
        <div id="stage">
            <div id="stage-note" class="dim"></div>
        </div>
        <div id="bar">
            <!-- Geometric glyphs rather than the media-control emoji (⏮ ⏭ 🔊),
                 which the platform font draws in colour as little rounded
                 boxes — three coloured stickers where the bar wants three
                 controls. These are text at any size. -->
            <button id="t-home" class="tiny mono" title="Start (Home)">|◀</button>
            <button id="t-play" class="tiny mono" title="Play (Space)">▶</button>
            <button id="t-end" class="tiny mono" title="End (End)">▶|</button>
            <span id="t-time" class="mono"></span>
            <span class="spacer"></span>
            <span id="t-what" class="dim"></span>
            <button id="t-mute" class="tiny mono" title="Mute (M)">♪</button>
        </div>
    </section>

</div>

<!-- Drag to give the mix more room, or less. **The default is not "as little as
     will do"**: editing is the job here and the picture is what you check it
     against, so the row of cards gets a third of the window rather than a strip
     at the bottom, and anybody who wants to look at a frame can take it back. -->
<div id="split" title="Drag"></div>

<!-- The mix. A single row of cards in the order they play, because that is what
     a supercut is — there is no second track to put anything on and no ruler to
     read, so the cards are the ruler. -->
<footer id="mix">
    <div id="mix-head">
        <span class="label">the mix</span>
        <span id="mix-note" class="dim"></span>
        <span class="spacer"></span>
        <button id="btn-fit" class="text" title="Fit">Fit</button>
        <input id="zoom" type="range" min="2" max="1200" step="1" value="120">
        <button id="btn-clear" class="text" title="Remove every clip">Clear</button>
    </div>
    <div id="strip">
        <div id="cards"></div>
        <div id="playhead"></div>
    </div>
    <!-- Where the window is on the mix, and how much of it there is. Drawn here
         because this engine has no horizontal scrolling of its own and because
         the position it shows is in seconds — see the header of `mix.js`. -->
    <div id="mix-scroll"><div id="mix-thumb"></div></div>
</footer>

<div id="flash"></div>

<script type="module" src="app.js"></script>
</body>
</html>
